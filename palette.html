<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="palette.css"><script src="palette-i18n.js"></script></head><body>
<header><h1 id="title">Bambu Lab · NATIVE V10</h1><div id="count" class="count"></div>
<div class="controls">
<input id="q" placeholder="Search..." oninput="filterCards()">
<select id="cat" onchange="filterCards()"></select>
<select id="mat" onchange="filterCards()"></select>
<select id="finish" onchange="filterCards()"></select>
<select id="scope"></select>
</div>
<div class="parentbar">
  <button id="exportF3d" class="parentbtn" onclick="adsk.fusionSendData('export_parent_f3d','')"></button>
  <button id="export3mf" class="parentbtn" onclick="adsk.fusionSendData('export_parent_3mf','')"></button>
  <button id="exportBoth" class="parentbtn wide" onclick="adsk.fusionSendData('export_parent_bundle','')"></button>
</div>
<div id="status"></div></header>
<div id="grid" class="grid"></div>
<script>
const FINISH_ORDER=['translucent','multi','glow','sparkle','metallic','wood','fiber','standard','matte','silk'];
const FINISH_BADGE={glow:'GLOW',sparkle:'SPARKLE',metallic:'METALLIC',wood:'WOOD',fiber:'FIBER'};
const SCOPE_OPTIONS=['body','face','component','selected_all','all_model'];

let currentLang='en';
let catalog=[];
let activeKey='';
let catalogMeta={version:'-',entryCount:0,source:'none'};
let catalogLoaded=false;
let requestAttempts=0;
const MAX_REQUEST_ATTEMPTS=4;

function textFor(entry,key){
  const obj=entry[key];
  if(obj && typeof obj==='object') return obj[currentLang]||obj.en||'';
  return '';
}

function normalizeEntry(raw){
  if(!raw || typeof raw!=='object') return null;
  const category=raw.category||raw.family||'';
  const material=raw.material||raw.product_line||'';
  const colorName=raw.color_name||raw.color||raw.name||'';
  const hex=raw.hex||raw.primary_hex||'';
  if(!material || !colorName || !hex) return null;
  const hexes=Array.isArray(raw.hexes)&&raw.hexes.length?raw.hexes:[hex];
  const translucent=!!raw.translucent;
  const multi=raw.is_multi_color===true || hexes.length>1;
  const finish=(raw.finish||'standard').toLowerCase();
  const badges=[];
  if(translucent) badges.push('TRANS');
  if(multi) badges.push('MULTI');
  if(FINISH_BADGE[finish]) badges.push(FINISH_BADGE[finish]);
  return {
    category:category,
    material:material,
    color_name:colorName,
    categoryDisplay:textFor(raw,'category_i18n')||category,
    materialDisplay:textFor(raw,'material_i18n')||material,
    colorDisplay:textFor(raw,'color_name_i18n')||colorName,
    hex:hex,
    hexes:hexes,
    translucent:translucent,
    opacity:Number(raw.opacity||1),
    roughness:Number(raw.roughness||0.44),
    finish:finish,
    searchText:(raw.search_text||(`${category} ${material} ${colorName}`)).toLowerCase(),
    badges:Array.isArray(raw.ui_badges)&&raw.ui_badges.length?raw.ui_badges:badges
  };
}

function extractCatalogPayload(rawPayload){
  if(Array.isArray(rawPayload)){
    return {entries:rawPayload,meta:{version:'legacy-array',entryCount:rawPayload.length}};
  }
  if(!rawPayload || typeof rawPayload!=='object'){
    return {entries:[],meta:{version:'invalid',entryCount:0}};
  }
  const entries=
    Array.isArray(rawPayload.entries)?rawPayload.entries:
    (Array.isArray(rawPayload.items)?rawPayload.items:
    (Array.isArray(rawPayload.data)?rawPayload.data:[]));
  const version=String(rawPayload.catalog_version||rawPayload.version||rawPayload.generated_epoch||'unknown');
  const entryCount=Number(rawPayload.entry_count||entries.length||0);
  return {entries:entries,meta:{version:version,entryCount:entryCount,schema:rawPayload.schema_version||'n/a'}};
}

function colorKey(e){
  return [e.material,e.color_name,e.hex].join('|');
}

function swatchBackground(e){
  const colors=e.hexes.filter(Boolean);
  const gradient=colors.length>1?`linear-gradient(90deg, ${colors.join(', ')})`:(colors[0]||e.hex||'#999999');
  if(e.translucent){
    return `linear-gradient(${(e.hex||colors[0]||'#cccccc')}99, ${(e.hex||colors[0]||'#cccccc')}99), repeating-conic-gradient(#e5e5e5 0 25%,#777 0 50%) 50%/10px 10px`;
  }
  return gradient;
}

function buildScopeOptions(){
  const t=I18N[currentLang];
  const labels={
    body:t.scopeBody,
    face:t.scopeFace,
    component:t.scopeComponent,
    selected_all:t.scopeSelected,
    all_model:t.scopeModel
  };
  const scope=document.getElementById('scope');
  const prev=scope.value||'body';
  scope.innerHTML='';
  SCOPE_OPTIONS.forEach(k=>{
    const o=document.createElement('option');
    o.value=k;
    o.textContent=labels[k];
    scope.appendChild(o);
  });
  scope.value=SCOPE_OPTIONS.includes(prev)?prev:'body';
}

function uniqueSorted(values){
  return Array.from(new Set(values)).sort((a,b)=>a.localeCompare(b));
}

function fillSelect(select,firstLabel,values,labelFn){
  const prev=select.value||'';
  select.innerHTML='';
  const any=document.createElement('option');
  any.value='';
  any.textContent=firstLabel;
  select.appendChild(any);
  values.forEach(v=>{
    const o=document.createElement('option');
    o.value=v;
    o.textContent=labelFn?labelFn(v):v;
    select.appendChild(o);
  });
  select.value=values.includes(prev)?prev:'';
}

function populateFilters(){
  const t=I18N[currentLang];
  const categories=uniqueSorted(catalog.map(e=>e.category));
  const materials=uniqueSorted(catalog.map(e=>e.material));
  const finishes=uniqueSorted(catalog.map(e=>e.finish));
  const finOptions=[...FINISH_ORDER.filter(x=>x==='multi'||finishes.includes(x)),...finishes.filter(x=>!FINISH_ORDER.includes(x))];

  fillSelect(document.getElementById('cat'),t.allFamilies,categories,c=>{
    const sample=catalog.find(e=>e.category===c);
    return sample?sample.categoryDisplay:c;
  });
  fillSelect(document.getElementById('mat'),t.allLines,materials,m=>{
    const sample=catalog.find(e=>e.material===m);
    return sample?sample.materialDisplay:m;
  });
  fillSelect(document.getElementById('finish'),t.allFinishes,finOptions,f=>t.finishLabels[f]||f);
}

function updateCount(){
  const refs=catalog.length;
  const lines=new Set(catalog.map(e=>e.material)).size;
  document.getElementById('count').textContent=`${refs} references - ${lines} product lines - data ${catalogMeta.version} (${catalogMeta.source})`;
}

function renderCards(items){
  const grid=document.getElementById('grid');
  grid.innerHTML='';
  const frag=document.createDocumentFragment();

  items.forEach(e=>{
    const btn=document.createElement('button');
    btn.className='card';
    const key=colorKey(e);
    if(activeKey===key) btn.classList.add('active');
    btn.dataset.cat=e.category;
    btn.dataset.material=e.material;
    btn.dataset.search=e.searchText;

    const sw=document.createElement('span');
    sw.className='swatch';
    sw.style.background=swatchBackground(e);

    const txt=document.createElement('span');
    txt.className='txt';
    const b=document.createElement('b');
    b.textContent=e.colorDisplay;
    const sm=document.createElement('small');
    sm.textContent=`${e.materialDisplay} · ${e.hex}`;
    txt.appendChild(b);
    txt.appendChild(sm);

    btn.appendChild(sw);
    btn.appendChild(txt);

    e.badges.forEach(label=>{
      const badge=document.createElement('span');
      badge.className='badge';
      badge.textContent=label;
      btn.appendChild(badge);
    });

    btn.addEventListener('click',()=>applyColor(e,btn));
    frag.appendChild(btn);
  });

  grid.appendChild(frag);
}

function applyColor(e,btn){
  document.querySelectorAll('.card').forEach(x=>x.classList.remove('active'));
  btn.classList.add('active');
  activeKey=colorKey(e);
  document.getElementById('status').textContent=I18N[currentLang].applying+e.materialDisplay+' · '+e.colorDisplay;
  const payload={
    material:e.material,
    color_name:e.color_name,
    hex:e.hex,
    hexes:e.hexes,
    translucent:e.translucent,
    opacity:e.opacity,
    roughness:e.roughness,
    finish:e.finish,
    scope:document.getElementById('scope').value
  };
  adsk.fusionSendData('apply',JSON.stringify(payload));
}

function finishMatch(entry,finishFilter){
  if(!finishFilter) return true;
  if(finishFilter==='multi') return entry.badges.includes('MULTI');
  if(finishFilter==='translucent') return entry.badges.includes('TRANS');
  return entry.finish===finishFilter;
}

function filterCards(){
  const q=document.getElementById('q').value.toLowerCase();
  const cat=document.getElementById('cat').value;
  const mat=document.getElementById('mat').value;
  const fin=document.getElementById('finish').value;

  const filtered=catalog.filter(e=>{
    if(q && !e.searchText.includes(q)) return false;
    if(cat && e.category!==cat) return false;
    if(mat && e.material!==mat) return false;
    if(!finishMatch(e,fin)) return false;
    return true;
  });

  renderCards(filtered);
}

function setUiLanguage(lang){
  currentLang=I18N[lang]?lang:'en';
  const t=I18N[currentLang];
  document.documentElement.lang=t.lang;
  document.getElementById('title').textContent=t.title;
  document.getElementById('q').placeholder=t.searchPlaceholder;
  document.getElementById('exportF3d').textContent=t.exportF3d;
  document.getElementById('export3mf').textContent=t.export3mf;
  document.getElementById('exportBoth').textContent=t.exportBoth;
  buildScopeOptions();
  populateFilters();
  updateCount();
  if(!document.getElementById('status').textContent) document.getElementById('status').textContent=t.idleStatus;
  filterCards();
}

function setCatalog(rawCatalog,meta,source){
  const next=(Array.isArray(rawCatalog)?rawCatalog:[])
    .map(normalizeEntry)
    .filter(Boolean);
  catalog=next;
  catalogMeta={
    version:(meta && meta.version)?String(meta.version):'unknown',
    entryCount:(meta && Number.isFinite(meta.entryCount))?meta.entryCount:next.length,
    source:source||'unknown'
  };
  catalogLoaded=next.length>0;
  populateFilters();
  updateCount();
  filterCards();
  if(!catalogLoaded){
    document.getElementById('status').textContent='Catalog is empty. Check JSON schema or file availability.';
  }
}

function requestCatalog(){
  requestAttempts+=1;
  try{
    adsk.fusionSendData('request_catalog','');
    return true;
  }catch(_){
    return false;
  }
}

function requestLanguage(){
  try{
    adsk.fusionSendData('request_lang','');
    return true;
  }catch(_){
    return false;
  }
}

async function fallbackLoadCatalog(){
  try{
    const response=await fetch('./bambulab_full_catalog.json');
    if(!response.ok) return;
    const data=await response.json();
    const extracted=extractCatalogPayload(data);
    if(catalog.length===0) setCatalog(extracted.entries,extracted.meta,'file-fetch');
  }catch(_){
    // Keep silent; Fusion bridge is the primary source.
  }
}

function scheduleCatalogRetries(){
  [250,800,1600,3000].forEach((ms,index)=>{
    setTimeout(()=>{
      if(catalogLoaded || requestAttempts>=MAX_REQUEST_ATTEMPTS) return;
      requestCatalog();
      if(index===3 && !catalogLoaded) fallbackLoadCatalog();
    },ms);
  });
}

function scheduleLanguageRetries(){
  [250,800,1600,3000].forEach((ms)=>{
    setTimeout(()=>{
      if(typeof adsk !== 'undefined' && adsk && typeof adsk.fusionSendData === 'function') {
        requestLanguage();
      }
    },ms);
  });
}

window.fusionJavaScriptHandler={
  handle:function(action,data){
    if(action==='status') document.getElementById('status').textContent=data;
    if(action==='setLang') setUiLanguage((data||'').toLowerCase());
    if(action==='catalog'){
      try{
        const parsed=JSON.parse(data||'[]');
        const extracted=extractCatalogPayload(parsed);
        setCatalog(extracted.entries,extracted.meta,'fusion-bridge');
      }
      catch(_){ setCatalog([],null,'fusion-bridge'); }
    }
    return 'OK';
  }
};

setUiLanguage('fr');
requestLanguage();
scheduleLanguageRetries();
requestCatalog();
scheduleCatalogRetries();
setTimeout(()=>{ if(!catalogLoaded) fallbackLoadCatalog(); },500);
</script></body></html>
