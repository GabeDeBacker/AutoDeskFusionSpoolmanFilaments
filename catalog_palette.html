<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="palette.css">
  <script src="scripts/palette-i18n.js"></script>
  <script src="scripts/fusion_helpers.js"></script>
  <script src="scripts/color_helpers.js"></script>
</head>

<body>
  <header>
    <div id="app">
      <div id="content">
        <div class="controls">
          <input id="query" placeholder="Search..." oninput="onFilterChange()">
          <select id="manufacturer" onchange="onFilterChange()"></select>
          <select id="material" onchange="onFilterChange()"></select>
          <select id="finish" onchange="onFilterChange()"></select>
          <select id="sort" onchange="onFilterChange()"></select>
          <div>
            <label class="translucent-toggle">
              <input id="translucentOn" type="checkbox" onchange="onFilterChange()">
              <span id="translucentLabel"></span>
            </label>
            <label class="glow-toggle">
              <input id="glowOn" type="checkbox" onchange="onFilterChange()">
              <span id="glowLabel"></span>
            </label>
          </div>
          <div id="scopeGroup" class="scope-radio-group" role="radiogroup" aria-label="Apply scope"></div>
        </div>
        <div class="colorfilter">
          <label class="colorfilter-toggle">
            <input id="colorFilterOn" type="checkbox" onchange="onColorFilterToggleChange()">
            <span id="colorFilterLabel"></span>
          </label>
          <div id="colorFilterDetails" class="hidden">
            <div id="colorWheel" class="colorwheel" onclick="pickColorFromWheel(event)"></div>
            <div class="colorfilter-sliders">
              <div class="colorfilter-label">Tolerances</div>
              <div class="colorfilter-slider">
                <label for="colorFilterHue">H</label>
                <input id="colorFilterHue" type="range" min="1" max="100" step="1" value="10"
                  oninput="onColorToleranceInput()">
                <span id="colorFilterHueValue" class="count">10%</span>
              </div>
              <div class="colorfilter-slider">
                <label for="colorFilterSat">S</label>
                <input id="colorFilterSat" type="range" min="1" max="100" step="1" value="10"
                  oninput="onColorToleranceInput()">
                <span id="colorFilterSatValue" class="count">10%</span>
              </div>
              <div class="colorfilter-slider">
                <label for="colorFilterVal">V</label>
                <input id="colorFilterVal" type="range" min="1" max="100" step="1" value="10"
                  oninput="onColorToleranceInput()">
                <span id="colorFilterValValue" class="count">10%</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div> <!-- end of #content -->
  </header>
  </div>
  <div id="grid" class="grid"></div>
  <footer id="pager" class="pagerfooter">
    <div id="status"></div>
    <div class="pagerrow pagerrow-bottom">
      <div class="headicons footer-icons">
        <button id="openSettings" class="iconbtn" onclick="openSettingsPalette()"></button>
      </div>
      <div class="pager-controls">
        <button id="firstPageBtn" class="pagerbtn" onclick="firstPage()"></button>
        <button id="prevPageBtn" class="pagerbtn" onclick="prevPage()"></button>
        <span id="pageIndicator" class="pageindicator"></span>
        <button id="nextPageBtn" class="pagerbtn" onclick="nextPage()"></button>
        <button id="lastPageBtn" class="pagerbtn" onclick="lastPage()"></button>
      </div>
      <select id="pageSizeSelect" onchange="onPageSizeChange()"></select>
    </div>
  </footer>
  <script src="scripts/catalog_palette_state.js"></script>
  <script src="scripts/catalog_palette_controls.js"></script>
  <script src="scripts/catalog_palette_color_filter.js"></script>
  <script src="scripts/catalog_palette_render.js"></script>
  <script src="scripts/catalog_palette_data.js"></script>
  <script src="scripts/catalog_palette_bootstrap.js"></script>
</body>

</html>
