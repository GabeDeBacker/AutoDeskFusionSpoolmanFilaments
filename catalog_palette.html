<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <link rel="stylesheet" href="palette.css">
  <script src="palette-i18n.js"></script>
  <script src="fusion_helpers.js"></script>
  <script src="color_helpers.js"></script>
</head>

<body>
  <header>
    <div id="app">
      <div id="content">
        <div class="controls">
          <input id="q" placeholder="Search..." oninput="onFilterChange()">
          <select id="cat" onchange="onFilterChange()"></select>
          <select id="mat" onchange="onFilterChange()"></select>
          <select id="finish" onchange="onFilterChange()"></select>
          <select id="sort" onchange="onFilterChange()"></select>
          <div>
            <label class="translucent-toggle">
              <input id="translucentOn" type="checkbox" onchange="onFilterChange()">
              <span id="translucentLabel"></span>
            </label>
            <label class="glow-toggle">
              <input id="glowOn" type="checkbox" onchange="onFilterChange()">
              <span id="glowLabel"></span>
            </label>
          </div>
          <div id="scopeGroup" class="scope-radio-group" role="radiogroup" aria-label="Apply scope"></div>
        </div>
        <div class="colorfilter">
          <label class="colorfilter-toggle">
            <input id="colorFilterOn" type="checkbox" onchange="onColorFilterToggleChange()">
            <span id="colorFilterLabel"></span>
          </label>
          <div id="colorFilterDetails" class="hidden">
            <div class="colorfilter-row">
              <div id="colorWheel" class="colorwheel" onclick="pickColorFromWheel(event)" aria-label="Color wheel"
                role="button" tabindex="0">
                <span class="colorwheel-dim"></span>
                <span id="colorWheelAllowedA" class="colorwheel-allowed"></span>
                <span id="colorWheelAllowedB" class="colorwheel-allowed"></span>
                <span id="colorWheelCenter" class="colorwheel-center"
                  ondblclick="document.getElementById('colorFilterHex').click()" aria-label="Open color picker"
                  role="button" tabindex="0"></span>
              </div>
              <div class="colorfilter-sliders">
                <div class="colorfilter-label">Tolerances</div>
                <div class="colorfilter-slider">
                  <label for="colorFilterHue">H</label>
                  <input id="colorFilterHue" type="range" min="0" max="100" step="1" value="10"
                    oninput="onColorToleranceInput()">
                  <span id="colorFilterHueValue" class="count">10%</span>
                </div>
                <div class="colorfilter-slider">
                  <label for="colorFilterSat">S</label>
                  <input id="colorFilterSat" type="range" min="0" max="100" step="1" value="10"
                    oninput="onColorToleranceInput()">
                  <span id="colorFilterSatValue" class="count">10%</span>
                </div>
                <div class="colorfilter-slider">
                  <label for="colorFilterVal">V</label>
                  <input id="colorFilterVal" type="range" min="0" max="100" step="1" value="10"
                    oninput="onColorToleranceInput()">
                  <span id="colorFilterValValue" class="count">10%</span>
                </div>
              </div>
              <input id="colorFilterHex" type="color" value="#4f8cff" oninput="onColorHexInput()"/>
            </div>
          </div>
        </div>
      </div> <!-- end of #content -->
  </header>
  </div>
  <div id="grid" class="grid"></div>
  <footer id="pager" class="pagerfooter">
    <div id="status"></div>
    <div class="pagerrow pagerrow-bottom">
      <div class="headicons footer-icons">
        <button id="openSettings" class="iconbtn" onclick="openSettingsPalette()"></button>
      </div>
      <div class="pager-controls">
        <button id="firstPageBtn" class="pagerbtn" onclick="firstPage()"></button>
        <button id="prevPageBtn" class="pagerbtn" onclick="prevPage()"></button>
        <span id="pageIndicator" class="pageindicator"></span>
        <button id="nextPageBtn" class="pagerbtn" onclick="nextPage()"></button>
        <button id="lastPageBtn" class="pagerbtn" onclick="lastPage()"></button>
      </div>
      <select id="pageSizeSelect" onchange="onPageSizeChange()"></select>
    </div>
  </footer>
  <script>
    const FINISH_ORDER = ['translucent', 'multi', 'glow', 'sparkle', 'metallic', 'wood', 'fiber', 'standard', 'matte', 'silk'];
    const FINISH_BADGE = { glow: 'GLOW', sparkle: 'SPARKLE', metallic: 'METALLIC', wood: 'WOOD', fiber: 'FIBER' };
    const SCOPE_OPTIONS = ['body', 'face'];
    const PAGE_SIZE_OPTIONS = [20, 40, 80, 120, 200];
    const DEFAULT_PAGE_SIZE = 40;
    const DEFAULT_COLOR_FILTER_HEX = '#FF4F8CFF';
    const MAX_COLOR_FILTER_TOLERANCE = 100;
    const DEFAULT_COLOR_FILTER_DISTANCE = 10;
    const DEFAULT_HUE_TOLERANCE = 10;
    const DEFAULT_SAT_TOLERANCE = 10;
    const DEFAULT_VAL_TOLERANCE = 10;
    const COLOR_DISTANCE_HUE_WEIGHT = 0.9;
    const COLOR_DISTANCE_SAT_WEIGHT = 0.07;
    const COLOR_DISTANCE_LUM_WEIGHT = 0.03;
    const NEUTRAL_SAT_THRESHOLD = 0.12;
    const VIBRANT_SAT_THRESHOLD = 0.4;
    let currentLang = 'en';
    let catalog = {
      total: 0,
      page: 1,
      pageSize: DEFAULT_PAGE_SIZE,
      pages: 1,
      results: []
    };
    let activeKey = '';
    let currentScope = 'body';

    const ALL_MANUFACTURERS_VALUE = 'allManufacturers';
    const ALL_MATERIALS_VALUE = 'allMaterials';
    const ALL_FINISHES_VALUE = 'allFinishes';

    function textFor(entry, key) {
      const obj = entry[key];
      if (obj && typeof obj === 'object') return obj[currentLang] || obj.en || '';
      return '';
    }

    function colorKey(e) {
      if (e.color_hex) {
        return [e.material, e.name, e.color_hex].join('|');
      }

      if (e.color_hexes && e.color_hexes.length > 0) {
        return [e.material, e.name, e.color_hexes.join(',')].join('|');
      }
      return [e.material, e.name].join('|');
    }

    function swatchBackground(e) {
      const colors = e.color_hexes;
      let defaultStart = '#cccccc88';
      let defaultEnd = "#ccccccff";
      let gradientType = 'linear-gradient(90deg, ';
      let translucentStart = e.translucent ? '25' : 'FF';
      let translucentEnd = 'FF';
      if (e.multi_color_direction  === 'coaxial') {
        gradientType = 'radial-gradient(circle, ';
      }

      if ((!colors || colors.length === 0) && e.color_hex) {
        const start = normalizeHex(e.color_hex, translucentStart);
        const end = normalizeHex(e.color_hex, translucentEnd);
        gradient = `${gradientType}${start}, ${end})`;
      } else if (colors && colors.length > 0) {
        if (colors.length === 1) {
          const start = normalizeHex(colors[0], translucentStart);
          const end = normalizeHex(colors[0], translucentEnd);
          gradient = `${gradientType}${start}, ${end})`;
        } else {
          const starts = colors.map((c) => normalizeHex(c, translucentStart));
          const ends = colors.map((c) => normalizeHex(c, translucentEnd));
          gradient = `${gradientType}${starts.join(", ")}, ${ends.join(
            ", "
          )})`;
        }
      }

      if (!gradient) {
        const start = normalizeHex(defaultStart, translucentStart);
        const end = normalizeHex(defaultEnd, translucentEnd);
        gradient = `${gradientType}${start}, ${end})`;
      }
      return gradient;
    }

    function fillSelect(select, allLabel, allValue, values, labelFn) {
      const prev = select.value || '';
      // Clear previous options
      select.innerHTML = '';

      // Add the "All" option
      const any = document.createElement('option');
      any.value = allValue;;
      any.textContent = allLabel;
      select.appendChild(any);

      select.disabled = values.length == 0;

      values.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = labelFn ? labelFn(v) : v;
        select.appendChild(o);
      });
      select.value = values.includes(prev) ? prev : allValue;
    }

    function updatePageSizeControl() {
      const t = I18N[currentLang] || I18N.en;
      const select = document.getElementById('pageSizeSelect');
      const prev =   select.value || DEFAULT_PAGE_SIZE;
      select.innerHTML = '';
      PAGE_SIZE_OPTIONS.forEach(v => {
        const o = document.createElement('option');
        o.value = v;
        o.textContent = `${t.perPageLabel} ${v}`;
        select.appendChild(o);
      });
      select.value = PAGE_SIZE_OPTIONS.includes(prev) ? prev : DEFAULT_PAGE_SIZE;
    }

    function updateSortControl() {
      const t = I18N[currentLang] || I18N.en;
      const select = document.getElementById('sort');
      const prev = select.value || 'name';
      select.innerHTML = '';
      const options = [
        { value: 'name', label: t.sortByName },
        { value: 'color', label: t.sortByColor }
      ];
      options.forEach(opt => {
        const o = document.createElement('option');
        o.value = opt.value;
        o.textContent = opt.label;
        select.appendChild(o);
      });
      select.value = options.some(opt => opt.value === prev) ? prev : 'name';
    }

    function buildScopeOptions() {
      const t = I18N[currentLang] || I18N.en;
      const labels = {
        body: t.scopeBody,
        face: t.scopeFace
      };
      const scopeGroup = document.getElementById('scopeGroup');
      const prev = currentScope || 'body';
      scopeGroup.innerHTML = '';
      const title = document.createElement('span');
      title.id = 'scopeLabel';
      title.className = 'scope-radio-title';
      title.textContent = t.scopeLabel;
      scopeGroup.appendChild(title);
      SCOPE_OPTIONS.forEach((k) => {
        const id = `scope-${k}`;
        const label = document.createElement('label');
        label.className = 'scope-radio-option';
        label.htmlFor = id;

        const input = document.createElement('input');
        input.type = 'radio';
        input.name = 'scope';
        input.id = id;
        input.value = k;
        input.checked = k === prev;
        input.addEventListener('change', () => setScopeFromUi(k));

        const text = document.createElement('span');
        text.textContent = labels[k] || k;

        label.appendChild(input);
        label.appendChild(text);
        scopeGroup.appendChild(label);
      });
      currentScope = SCOPE_OPTIONS.includes(prev) ? prev : 'body';
      const active = document.querySelector(`input[name="scope"][value="${currentScope}"]`);
      if (active) active.checked = true;
    }

    function setScopeFromUi(nextScope) {
      const selected = typeof nextScope === 'string'
        ? nextScope
        : ((document.querySelector('input[name="scope"]:checked') || {}).value || 'body');
      currentScope = SCOPE_OPTIONS.includes(selected) ? selected : 'body';
      sendToFusion('set_scope', { scope: currentScope });
    }

    function clampTolerance(value, fallback, maxValue = MAX_COLOR_FILTER_TOLERANCE) {
      const numeric = Number(value);
      if (!Number.isFinite(numeric)) return fallback;
      return Math.max(0, Math.min(maxValue, Math.round(numeric)));
    }

    function getColorToleranceSettings() {
      return {
        hue: clampTolerance(parseInt(document.getElementById('colorFilterHue').value), DEFAULT_HUE_TOLERANCE),
        sat: clampTolerance(parseInt(document.getElementById('colorFilterSat').value), DEFAULT_SAT_TOLERANCE),
        val: clampTolerance(parseInt(document.getElementById('colorFilterVal').value), DEFAULT_VAL_TOLERANCE)
      };
    }

    function updateColorFilterUiState() {
      const enabled = document.getElementById('colorFilterOn').checked;
      document.getElementById('colorFilterHex').disabled = !enabled;
      document.getElementById('colorFilterHue').disabled = !enabled;
      document.getElementById('colorFilterSat').disabled = !enabled;
      document.getElementById('colorFilterVal').disabled = !enabled;
      document.getElementById('colorFilterDetails').classList.toggle('hidden', !enabled);
      document.getElementById('colorWheel').classList.toggle('disabled', !enabled);
    }

    function updateColorDistanceLabel() {
      const tolerance = getColorToleranceSettings();
      document.getElementById('colorFilterHueValue').textContent = `${tolerance.hue}%`;
      document.getElementById('colorFilterSatValue').textContent = `${tolerance.sat}%`;
      document.getElementById('colorFilterValValue').textContent = `${tolerance.val}%`;
    }

    function hueDistanceRadius(targetHsl, threshold) {
      const hueWeight = targetHsl.s < 0.08 ? 0.2 : 1.0;
      const effectiveHueWeight = Math.max(0.01, COLOR_DISTANCE_HUE_WEIGHT * hueWeight);
      const maxHueDiff = Math.min(0.5, threshold / effectiveHueWeight);
      return maxHueDiff;
    }

    function setWheelArc(el, startDeg, endDeg) {
      const span = Math.max(0, endDeg - startDeg);
      if (span <= 0) {
        el.style.display = 'none';
        el.style.background = 'none';
        return;
      }
      el.style.display = 'block';
      el.style.background = `conic-gradient(from ${startDeg - 90}deg, rgba(255,255,255,.62) 0deg, rgba(255,255,255,.62) ${span}deg, transparent ${span}deg, transparent 360deg)`;
    }

    function setSelectedColorHex(hex) {
      let value = hex.replace(/^#/, "").trim();

      if (value.length === 6) {
        document.getElementById('colorFilterHex').value = `#${value}`;
      } else {
        document.getElementById('colorFilterHex').value = `#${value.substring(0, 6)}`;
      }
      onColorHexInput();
    }

    function pickColorFromWheel(event) {
      const wheel = document.getElementById('colorWheel');
      if (!wheel) return;
      const rect = wheel.getBoundingClientRect();
      const cx = rect.left + rect.width / 2;
      const cy = rect.top + rect.height / 2;
      const dx = (event.clientX || cx) - cx;
      const dy = (event.clientY || cy) - cy;
      const distance = Math.sqrt(dx * dx + dy * dy);
      const radius = Math.min(rect.width, rect.height) / 2;
      if (distance > radius) return;
      const wheelAngle = (Math.atan2(dy, dx) * 180 / Math.PI + 360) % 360;
      const angle = (wheelAngle + 180) % 360;
      const sat = Math.min(1, distance / radius);
      const rgb = hslToRgb(angle, sat, 0.5);
      setSelectedColorHex(rgbToHex(rgb.r, rgb.g, rgb.b));
    }

    function updateColorRangePreview(filters) {
      const safeFilters = filters || getCurrentFilters();
      const target = toHsl(safeFilters.filters.coloreFilterHex || DEFAULT_COLOR_FILTER_HEX);
      const hueTolerance = Number(safeFilters.filters.tolerances.hue || DEFAULT_HUE_TOLERANCE) / 100;
      const threshold = Math.max(0.05, Math.min(0.5, hueTolerance * 0.5));
      const radius = hueDistanceRadius(target, threshold);
      const start = target.h - radius;
      const end = target.h + radius;
      const rangeA = document.getElementById('colorWheelAllowedA');
      const rangeB = document.getElementById('colorWheelAllowedB');
      const center = document.getElementById('colorWheelCenter');
      center.style.background = safeFilters.filters.colorFilterHex || DEFAULT_COLOR_FILTER_HEX;

      if (radius >= 0.5) {
        setWheelArc(rangeA, 0, 360);
        setWheelArc(rangeB, 0, 0);
      } else {
        const startNorm = ((start % 1) + 1) % 1;
        const endNorm = ((end % 1) + 1) % 1;
        const startDeg = startNorm * 360;
        const endDeg = endNorm * 360;
        if (startNorm <= endNorm) {
          setWheelArc(rangeA, startDeg, endDeg);
          setWheelArc(rangeB, 0, 0);
        } else {
          setWheelArc(rangeA, 0, endDeg);
          setWheelArc(rangeB, startDeg, 360);
        }
      }

      const deg = Math.round(radius * 360);
      if (document.getElementById('colorHueHint')) {
        document.getElementById('colorHueHint').textContent = '';
      }
    }

    function displayManufacturer(entry) {
      return textFor(entry, 'manufacturer_i18n') || entry.manufacturer;
    }

    function displayMaterial(entry) {
      return textFor(entry, 'material_i18n') || entry.material;
    }

    function displayColor(entry) {
      return textFor(entry, 'color_name_i18n') || entry.name;
    }

    function renderCatalog(rawCatalog) {
      catalog = rawCatalog;
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      const frag = document.createDocumentFragment();

      rawCatalog.results.forEach((e) => {
        const btn = document.createElement('button');
        btn.className = 'card';
        const key = colorKey(e);
        if (activeKey === key) btn.classList.add('active');
        btn.dataset.cat = e.category;
        btn.dataset.material = e.material;
        btn.dataset.search=e.name;

        const sw = document.createElement('span');
        sw.className = 'swatch';
        sw.style.background = swatchBackground(e);

        const txt = document.createElement('span');
        txt.className = 'txt';
        const b = document.createElement('b');
        b.textContent = displayColor(e);
        const sm = document.createElement('small');
        color = e.color_hex ? e.color_hex : (e.color_hexes && e.color_hexes.length > 0 ? e.color_hexes[0] : '');
        textContent = [];
        if (document.getElementById('cat').value === ALL_MANUFACTURERS_VALUE) {
          textContent.push(displayManufacturer(e));
        }

        if (document.getElementById('mat').value === ALL_MATERIALS_VALUE) {
          textContent.push(displayMaterial(e));
        }

        sm.textContent = textContent.concat(color).join(' · ');
        txt.appendChild(b);
        txt.appendChild(sm);

        btn.appendChild(sw);
        btn.appendChild(txt);

        let badgeRow = btn.querySelector('.badge-row');
        if (!badgeRow) {
          badgeRow = document.createElement('div');
          badgeRow.className = 'badge-row';
          btn.appendChild(badgeRow);
        }

        if (e.finish) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = e.finish;
          badgeRow.appendChild(badge);
        }

        if (e.translucent) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = I18N[currentLang].translucentLabel;
          badgeRow.appendChild(badge);
        }

        if (e.glow) {
          const badge = document.createElement('span');
          badge.className = 'badge';
          badge.textContent = I18N[currentLang].glowLabel;
          badgeRow.appendChild(badge);
        }

        btn.addEventListener('click', () => applyColor(e, btn));
        frag.appendChild(btn);
      });

      grid.appendChild(frag);
    }

    function updatePager(rawCatalog) {
      const t = I18N[currentLang] || I18N.en;
      const pageSize = rawCatalog.pageSize;
      const totalPages = Math.max(1, Math.ceil(rawCatalog.total/rawCatalog.pageSize));
      const currentPage = Math.min(Math.max(1, rawCatalog.page), totalPages);
      document.getElementById('pageIndicator').textContent = `${t.pageLabel} ${currentPage}/${totalPages}`;
      document.getElementById('firstPageBtn').disabled = currentPage <= 1;
      document.getElementById('prevPageBtn').disabled = currentPage <= 1;
      document.getElementById('nextPageBtn').disabled = currentPage >= totalPages;
      document.getElementById('lastPageBtn').disabled = currentPage >= totalPages;
    }

    function prevPage() {
      catalog.page = Math.max(1, catalog.page - 1);
      sendFilamentQuery();
    }

    function firstPage() {
      catalog.page = 1;
      sendFilamentQuery();
    }

    function nextPage() {
      const pageSize = catalog.pageSize;
      const totalPages = Math.max(1, Math.ceil(catalog.total / pageSize));
      catalog.page = Math.min(totalPages, catalog.page + 1);
      sendFilamentQuery();
    }

    function lastPage() {
      const pageSize = catalog.pageSize;
      catalog.page = Math.max(1, Math.ceil(catalog.total / pageSize));
      sendFilamentQuery();
    }

    function onPageSizeChange() {
      catalog.page = 1;
      persistFilters();
      sendFilamentQuery();
    }

    function applyColor(e, btn) {
      document.querySelectorAll('.card').forEach(x => x.classList.remove('active'));
      btn.classList.add('active');
      activeKey = colorKey(e);
      document.getElementById('status').textContent = I18N[currentLang].applying + displayMaterial(e) + ' · ' + displayColor(e);
      sendToFusion('apply', e);
    }

    function getCurrentFilters() {
      return {
        scope: document.querySelector('input[name="scope"]:checked').value || SCOPE_OPTIONS[0],
        pageSize: parseInt(document.getElementById('pageSizeSelect').value || DEFAULT_PAGE_SIZE),
        filters: {
          q: (document.getElementById('q').value || "").toLowerCase(),
          cat: document.getElementById('cat').value || "",
          mat: document.getElementById('mat').value || "",
          fin: document.getElementById('finish').value || "",
          sort: document.getElementById('sort').value || "name",
          colorFilterOn: document.getElementById('colorFilterOn').checked,
          colorFilterHex: normalizeHex(document.getElementById('colorFilterHex').value),
          tolerances: getColorToleranceSettings(),
          translucent: document.getElementById('translucentOn').checked,
          glow: document.getElementById('glowOn').checked,
        },
      };
    }

    function saveUiState() {
      sendToFusion('save_ui_state', getCurrentFilters());
    }

    function applySavedUiState(uiState) {
      const filters = uiState.filters || {};
      document.getElementById('pageSizeSelect').value = uiState.pageSize || DEFAULT_PAGE_SIZE;
      document.getElementById('q').value = filters.q || "";
      document.getElementById('cat').value = filters.cat || "";
      document.getElementById('mat').value = filters.mat || "";
      document.getElementById('finish').value = filters.fin || "";
      document.getElementById('sort').value = filters.sort || "name";
      document.getElementById('colorFilterOn').checked = filters.colorFilterOn || false;
      document.getElementById('colorFilterHex').value = setSelectedColorHex(filters.colorFilterHex);
      document.getElementById('translucentOn').checked = filters.translucent || false;
      document.getElementById('glowOn').checked = filters.glow || false;

      if (filters.tolerances) {
        document.getElementById('colorFilterHue').value = clampTolerance(filters.tolerances.hue, DEFAULT_HUE_TOLERANCE, 100);
        document.getElementById('colorFilterSat').value = clampTolerance(filters.tolerances.sat, DEFAULT_SAT_TOLERANCE, 100);
        document.getElementById('colorFilterVal').value = clampTolerance(filters.tolerances.val, DEFAULT_VAL_TOLERANCE, 100);
      } else {
        document.getElementById('colorFilterHue').value = DEFAULT_HUE_TOLERANCE;
        document.getElementById('colorFilterSat').value = DEFAULT_SAT_TOLERANCE;
        document.getElementById('colorFilterVal').value = DEFAULT_VAL_TOLERANCE;
      }
      updateColorFilterUiState();
      updateColorDistanceLabel();
      sendFilamentQuery();
      sendFilterLists();
    }

    function onFilterChange() {
      const filters = getCurrentFilters();
      updateColorDistanceLabel();
      updateColorRangePreview(filters);
      saveUiState();
      sendFilterLists();
      sendFilamentQuery();
    }

    function onColorFilterToggleChange() {
      updateColorFilterUiState();
      onFilterChange();
    }

    function onColorToleranceInput() {
      updateColorDistanceLabel();
      onFilterChange();
    }

    function onColorHexInput() {
      onFilterChange();
    }

    function openSettingsPalette() {
      sendToFusion('open_settings_palette');
    }

    function setUiLanguage(lang) {
      currentLang = I18N[lang.lang] ? lang.lang : 'en';
      const t = I18N[currentLang];
      document.documentElement.lang = t.lang;
      document.getElementById('q').placeholder = t.searchPlaceholder;
      document.getElementById('openSettings').textContent = '⚙';
      document.getElementById('openSettings').title = t.openSettings;
      document.getElementById('openSettings').setAttribute('aria-label', t.openSettings);
      document.getElementById('colorFilterLabel').textContent = t.colorProximityLabel;
      document.getElementById('firstPageBtn').textContent = '◀◀';
      document.getElementById('prevPageBtn').textContent = '◀';
      document.getElementById('nextPageBtn').textContent = '▶';
      document.getElementById('lastPageBtn').textContent = '▶▶';
      document.getElementById('firstPageBtn').title = t.firstPage;
      document.getElementById('prevPageBtn').title = t.prevPage;
      document.getElementById('nextPageBtn').title = t.nextPage;
      document.getElementById('lastPageBtn').title = t.lastPage;
      document.getElementById('translucentLabel').textContent = t.translucentLabel;
      document.getElementById('translucentLabel').textContent = t.translucentLabel;
      document.getElementById('glowLabel').textContent = t.glowLabel;
      updatePageSizeControl();
      updateSortControl();
      buildScopeOptions();
      updateColorDistanceLabel();
      updateColorRangePreview();
    }

    function setCatalog(rawCatalog) {
      renderCatalog(rawCatalog);
      updatePager(rawCatalog);
    }

    function requestUiState() {
      sendToFusion('request_ui_state');
    }

    function requestLanguage() {
      sendToFusion('request_lang');
    }

    function setQueryResults(results) {
      setCatalog(results);
    }

    function setFilterLists(data) {
      const manufacturers = data.manufacturers || [];
      const materials = data.materials || [];
      const finishes = data.finishes || [];

      const allManufacturers = I18N[currentLang].allManufacturers;
      fillSelect(document.getElementById('cat'), allManufacturers, ALL_MANUFACTURERS_VALUE, manufacturers, m => m);

      const allMaterials = I18N[currentLang].allLines;
      fillSelect(document.getElementById('mat'), allMaterials, ALL_MATERIALS_VALUE, materials, m => m);

      const allFinishes = I18N[currentLang].allFinishes;
      fillSelect(document.getElementById('finish'), allFinishes, ALL_FINISHES_VALUE, finishes, f => f);
    }

    function setScope(data) {
      currentScope = SCOPE_OPTIONS.includes(data.scope) ? data.scope : 'body';
      const el = document.querySelector(`input[name="scope"][value="${currentScope}"]`);
      if (el) {
        el.checked = true;
      }
    }

    function getSelectElementValueOrNone(elementId, allValue) {
      const value = document.getElementById(elementId).value;
      return value === allValue ? null : value;
    }

    function sendFilterLists() {
      q = {
        manufacturer: getSelectElementValueOrNone('cat', ALL_MANUFACTURERS_VALUE),
        finish: getSelectElementValueOrNone('finish', ALL_FINISHES_VALUE),
        material: getSelectElementValueOrNone('mat', ALL_MATERIALS_VALUE)
      };
      sendToFusion("get_filter_lists", q);
    }

    function sendFilamentQuery() {
      const enabled = document.getElementById('colorFilterOn').checked;

      sendToFusion("query_filaments", {
        text: document.getElementById('q').value,
        manufacturer: getSelectElementValueOrNone('cat', ALL_MANUFACTURERS_VALUE),
        finish: getSelectElementValueOrNone('finish', ALL_FINISHES_VALUE),
        material: getSelectElementValueOrNone('mat', ALL_MATERIALS_VALUE),
        colorFilterOn: enabled,
        color: document.getElementById('colorFilterHex').value,
        hsvTolerance: {
          h: parseInt(document.getElementById('colorFilterHue').value) / 100,
          s: parseInt(document.getElementById('colorFilterSat').value) / 100,
          v: parseInt(document.getElementById('colorFilterVal').value) / 100,
        },
        sort: document.getElementById('sort').value,
        page: parseInt(catalog.page),
        pageSize: parseInt(document.getElementById('pageSizeSelect').value),
        translucent: document.getElementById('translucentOn').checked,
        glow: document.getElementById('glowOn').checked
      });
    }

    function handleRefreshCatalogComplete() {
      sendFilterLists();
      sendFilamentQuery();
    }

    function refreshCatalog() {
      sendToFusion('refresh_catalog', { force: false });
    }

    function fusionReady() {
      requestLanguage();
      sendFilterLists();
      requestUiState();
      updateColorFilterUiState();
      updateColorDistanceLabel();
      updateColorRangePreview();
      refreshCatalog();
    }

    setHandlers({
      'status': function (data) {
        document.getElementById('status').textContent = data;
      },
      'set_ui_state': applySavedUiState,
      'setLang': setUiLanguage,
      'filament_query_results': setQueryResults,
      'filter_lists_results': setFilterLists,
      'refresh_catalog_complete': handleRefreshCatalogComplete
    });

    const browserLang = (navigator.language || navigator.userLanguage || 'en').toLowerCase();
    setUiLanguage(browserLang.startsWith('fr') ? 'fr' : 'en');
    waitForAdsk(fusionReady);

  </script>
</body>

</html>
