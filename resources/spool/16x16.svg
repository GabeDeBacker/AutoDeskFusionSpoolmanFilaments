<?xml version="1.0" encoding="UTF-8"?>
<svg
  width="64"
  height="64"
  viewBox="0 0 64 64"
  xmlns="http://www.w3.org/2000/svg"
>
  <!-- Background (optional, remove if you want transparent) -->
  <rect x="0" y="0" width="64" height="64" fill="none"/>

  <!-- Outer spool rim -->
  <circle
    cx="32"
    cy="32"
    r="22"
    fill="#2b2f3a"
    stroke="#11141a"
    stroke-width="2"
  />

  <!-- Inner rim / flange -->
  <circle
    cx="32"
    cy="32"
    r="16"
    fill="#3b414f"
    stroke="#1b1f27"
    stroke-width="2"
  />

  <!-- Central hub -->
  <circle
    cx="32"
    cy="32"
    r="6"
    fill="#f4f4f6"
    stroke="#c0c4cc"
    stroke-width="2"
  />

  <!-- Filament wraps (radial slots) -->
  <!-- You can tweak stroke-width or count for different looks -->
  <g stroke="#f6a623" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="16" x2="32" y2="20" />
    <line x1="32" y1="44" x2="32" y2="48" />

    <line x1="16" y1="32" x2="20" y2="32" />
    <line x1="44" y1="32" x2="48" y2="32" />

    <line x1="23" y1="23" x2="26" y2="26" />
    <line x1="39" y1="39" x2="42" y2="42" />

    <line x1="23" y1="41" x2="26" y2="38" />
    <line x1="39" y1="25" x2="42" y2="22" />
  </g>

  <!-- Subtle highlight on top-left of rim -->
  <path
    d="M14 32
       A18 18 0 0 1 32 14"
    fill="none"
    stroke="#5b6274"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Subtle shadow on bottom-right of rim -->
  <path
    d="M32 50
       A18 18 0 0 1 50 32"
    fill="none"
    stroke="#101218"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.7"
  />

  <!-- Filament tail coming off the spool -->
  <path
    d="M46 38
       C52 40, 56 44, 54 48
       C52 52, 46 52, 42 49"
    fill="none"
    stroke="#f6a623"
    stroke-width="2"
    stroke-linecap="round"
  />
</svg>
