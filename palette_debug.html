<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="palette.css"><script src="palette-i18n.js"></script></head><body>
<header><h1 id="title">Filaments Debug</h1></header>
<div class="debug-layout">
  <section class="debug-section">
    <h2>Logging</h2>
    <ul id="logList" class="debug-list"></ul>
  </section>
  <section class="debug-section">
    <h2>Errors</h2>
    <ul id="errorList" class="debug-list debug-list-error"></ul>
  </section>
</div>
<button id="clearDebugBtn" class="debug-clear-btn" type="button">Clear</button>
<script>
function renderList(targetId, entries){
  const list=document.getElementById(targetId);
  if(!list) return;
  list.innerHTML='';
  if(!entries || !entries.length){
    const li=document.createElement('li');
    li.className='debug-empty';
    li.textContent='No entries yet.';
    list.appendChild(li);
    return;
  }
  entries.forEach((entry)=>{
    const li=document.createElement('li');
    li.className='debug-item';
    const stamp=new Date((entry && entry.timestamp ? entry.timestamp * 1000 : Date.now())).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
    const message = entry && entry.message ? String(entry.message) : 'Unknown';
    const detail = entry && entry.detail ? String(entry.detail) : '';
    li.textContent = detail ? `[${stamp}] ${message} — ${detail}` : `[${stamp}] ${message}`;
    list.appendChild(li);
  });
}

function renderState(payload){
  try{
    const parsed = JSON.parse(payload || '{}');
    renderList('logList', Array.isArray(parsed.logs) ? parsed.logs : []);
    renderList('errorList', Array.isArray(parsed.errors) ? parsed.errors : []);
  }catch(_){
    renderList('logList', []);
    renderList('errorList', []);
  }
}

function requestSnapshot(){
  try{
    adsk.fusionSendData('request_debug_snapshot','');
  }catch(_){
    // ignored
  }
}

function clearDebugLog(){
  renderList('logList', []);
  renderList('errorList', []);
  try{
    adsk.fusionSendData('clear_debug_log','');
  }catch(_){
    // ignored
  }
}

window.fusionJavaScriptHandler={
  handle:function(action,data){
    if(action==='debug_snapshot') renderState(data);
    if(action==='debug_cleared'){
      renderList('logList', []);
      renderList('errorList', []);
    }
    if(action==='setLang') {
      const lang=(data||'').toLowerCase();
      document.documentElement.lang=lang.startsWith('fr')?'fr':'en';
    }
    return 'OK';
  }
};

document.getElementById('clearDebugBtn').addEventListener('click', clearDebugLog);
requestSnapshot();
</script></body></html>
